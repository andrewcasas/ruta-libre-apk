plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ayelsea.rutalibre'
    compileSdk 34

    defaultConfig {
        applicationId "com.ayelsea.rutalibre"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
        buildConfigField "String", "HOME_URL", "\"https://rutalibre.ayelsea.net\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.9.0'
}
